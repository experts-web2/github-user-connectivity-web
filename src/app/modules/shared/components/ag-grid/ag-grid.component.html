<div class="ag-theme-quartz">
  <ag-grid-angular
  #myGrid
    style="width: 100%; height: 500px;"
    class="ag-theme-alpine"
    [gridOptions]="gridOptions"
    (selectionChanged)="onSelectionChanged($event)"
    (gridReady)="onGridReady($event)"
  >
  </ag-grid-angular>

  <div *ngIf="paginationObj" class="pagination-controls">
    <span>Page {{ paginationObj.currentPage }} of {{ paginationObj.totalPages }}</span>

    <button 
      (click)="goToPage(1)" 
      [disabled]="paginationObj.currentPage === 1"
    >
      First
    </button>
    <button 
      (click)="goToPage(paginationObj.currentPage - 1)" 
      [disabled]="paginationObj.currentPage === 1"
    >
      Previous
    </button>

    <button 
      (click)="goToPage(paginationObj.currentPage + 1)" 
      [disabled]="paginationObj.currentPage === paginationObj.totalPages"
    >
      Next
    </button>
    <button 
      (click)="goToPage(paginationObj.totalPages)" 
      [disabled]="paginationObj.currentPage === paginationObj.totalPages"
    >
      Last
    </button>
  </div>

</div>
